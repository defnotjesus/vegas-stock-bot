name: Dual Timeframe Vegas Scanner

on:
  schedule:
    # 1. Short-Term Hourly Check (Runs at the top of every hour, Mon-Fri)
    # Adjust cron hours based on UTC time zone if needed
    - cron: '0 * * * 1-5'
    
    # 2. Long-Term Daily Check (Runs once a day at 21:30 UTC, Mon-Fri)
    - cron: '30 21 * * * 1-5'
    
  workflow_dispatch: # Allows you to tap a button to run manually

jobs:
  # Job 1: Hourly Sweep Engine
  hourly-scan:
    if: github.event.schedule == '0 * * * 1-5' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install yfinance pandas requests
      - name: Run Hourly Short-Term Check
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python vegas_scanner.py 1h

  # Job 2: Daily Sweep Engine
  daily-scan:
    if: github.event.schedule == '30 21 * * * 1-5' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install yfinance pandas requests
      - name: Run Daily Long-Term Check
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python vegas_scanner.py 1d
