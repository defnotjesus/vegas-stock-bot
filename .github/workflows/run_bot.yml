name: Vegas Stock Bot Scanner

on:
  schedule:
    # 每個交易日（一到五）每小時執行一次 (可依需求調整 cron)
    - cron: "0 * * * 1-5"
    
  workflow_dispatch: # 允許在 GitHub 頁面上手動點擊按鈕執行

jobs:
  stock-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: pip install yfinance pandas requests
        
      - name: Run Vegas Tunnel Scanner
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        # 請把下面的 main.py 改成你實際上傳的 Python 檔案名稱
        run: python main.py
